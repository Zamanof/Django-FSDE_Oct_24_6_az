{% load static %}

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Oswald:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'notes/images/favicon.png' %}">
    <title>{% block title %}
        Knowledge Hub
    {% endblock %}</title>
</head>

<body class="d-flex flex-column min-vh-100">

{% include 'navbar.html' %}
<main class="flex-grow-1">
    <div class="container py-4 py-lg-5">
        {% if messages %}
            <div class="flash-messages mb-3">
                {% for message in messages %}
                    <div
                        class="auth-alert {% if 'error' in message.tags %}auth-alert-error{% elif 'success' in message.tags %}auth-alert-success{% else %}auth-alert-info{% endif %}"
                        role="alert"
                    >
                        <i class="bi {% if 'error' in message.tags %}bi-exclamation-circle-fill{% elif 'success' in message.tags %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}

        {% endblock %}
    </div>
</main>
<footer class="border-top py-3 mt-auto">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 text-secondary">
        <span class="fw-semibold text-dark">Knowledge Hub</span>
        <span>Qeydlərinizi bir yerdə saxlayın</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
