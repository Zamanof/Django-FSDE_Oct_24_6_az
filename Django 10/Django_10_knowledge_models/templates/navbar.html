{% load static %}
{% with url_name=request.resolver_match.url_name ns=request.resolver_match.namespace %}
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                <img src="{% static 'notes/images/logo.png' %}" alt="Knowledge Hub" class="navbar-logo">
                Knowledge Hub
            </a>
            <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Menyu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'home' %} active{% endif %}"
                                href="{% url 'home' %}"
                                {% if url_name == 'home' %}aria-current="page"{% endif %}
                        >Ana səhifə</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if url_name == 'about' %} active{% endif %}"
                                href="{% url 'about' %}"
                                {% if url_name == 'about' %}aria-current="page"{% endif %}
                        >Haqqında</a>
                    </li>
                    <li class="nav-item">
                        <a
                                class="nav-link{% if ns == 'notes' %} active{% endif %}"
                                href="{% url 'notes:notes_list' %}"
                                {% if ns == 'notes' %}aria-current="page"{% endif %}
                        >Qeydlər</a>
                    </li>
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <form method="post" action="{% url 'accounts:logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="nav-link">Çıxış</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a
                                    class="nav-link{% if ns == 'accounts' and url_name == 'login' or url_name == 'dashboard' %} active{% endif %}"
                                    href="{% url 'accounts:login' %}"
                                    {% if url_name == 'login' or url_name == 'dashboard' %}aria-current="page"{% endif %}
                            >Daxil ol</a>
                        </li>
                        <li class="nav-item">
                            <a
                                    class="nav-link{% if url_name == 'register' or url_name == 'register_success' %} active{% endif %}"
                                    href="{% url 'accounts:register' %}"
                                    {% if url_name == 'register' or url_name == 'register_success' %}aria-current="page"{% endif %}
                            >Qeydiyyat</a>
                        </li>

                    {% endif %}


                </ul>
            </div>
        </div>
    </nav>
{% endwith %}
