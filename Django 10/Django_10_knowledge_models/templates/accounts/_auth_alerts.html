{% if form.non_field_errors %}
    <div class="auth-alert auth-alert-error" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <div>
            {% for error in form.non_field_errors %}
                <div{% if not forloop.last %} class="mb-1"{% endif %}>{{ error }}</div>
            {% endfor %}
        </div>
    </div>
{% endif %}
