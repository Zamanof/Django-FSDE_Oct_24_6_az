{% extends 'base.html' %}

{% block title %}
	Çıxış
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
            <span class="badge rounded-pill badge-kicker mb-3">
                <i class="bi bi-box-arrow-right"></i>
                Təsdiq
            </span>
            <h1>Hesabdan çıxmaq istəyirsiniz?</h1>
            <p class="text-secondary">
                Çıxış etdikdən sonra qeydlərinizə daxil olmaq üçün yenidən hesabınıza giriş etməli olacaqsınız.
            </p>
            <form method="post">
            {% csrf_token %}
                <div class="d-flex flex-wrap gap-2 pt-3 mt-3 border-top">
                    <button class="btn btn-danger" type="submit">Bəli, çıxış et</button>
                    <a
                        class="btn btn-outline-secondary"
                        href="{% url 'accounts:dashboard' %}"
                    >
                        Ləğv et
                    </a>
                </div>
            </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
