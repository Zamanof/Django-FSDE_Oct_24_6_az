<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> {% block title %}
        Knowledge Hub
    {% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #eef2ff;

            --background: #f8fafc;
            --surface: #ffffff;

            --text: #0f172a;
            --text-secondary: #64748b;

            --border: #e2e8f0;

            --radius: 14px;

            --shadow: 0 1px 2px rgba(15, 23, 42, 0.04),
            0 8px 24px rgba(15, 23, 42, 0.06);
        }

        body {
            min-height: 100vh;

            font-family: Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

            background: var(--background);
            color: var(--text);

            line-height: 1.6;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            height: 64px;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 0 max(24px, calc((100% - 1000px) / 2));

            background: rgba(255, 255, 255, 0.9);

            border-bottom: 1px solid var(--border);

            position: sticky;
            top: 0;
            z-index: 100;

            backdrop-filter: blur(12px);
        }

        nav a {
            display: inline-flex;
            align-items: center;

            padding: 8px 14px;

            color: #475569;
            text-decoration: none;

            font-size: 14px;
            font-weight: 500;

            border-radius: 9px;

            transition: background-color 0.2s ease,
            color 0.2s ease;
        }

        nav a:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1000px, calc(100% - 40px));

            margin: 60px auto;
        }

        .card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            padding: 32px;

            box-shadow: var(--shadow);
        }

        h1 {
            margin-bottom: 12px;

            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.2;

            letter-spacing: -0.03em;

            color: var(--text);
        }

        p {
            margin: 10px 0;

            color: var(--text-secondary);
        }


        /* =========================
           LINKS
        ========================= */

        main a {
            color: var(--primary-dark);
            font-weight: 500;
            text-decoration: none;
        }

        main a:hover {
            text-decoration: underline;
        }


        /* =========================
           NOTES LIST
        ========================= */

        ul {
            list-style: none;

            display: grid;
            gap: 12px;

            margin: 28px 0;
        }

        li {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 12px;

            transition: transform 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease;
        }

        li:hover {
            transform: translateY(-2px);

            border-color: #c7d2fe;

            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
        }

        li a {
            display: block;

            padding: 18px 20px;

            color: var(--text);

            font-weight: 600;

            text-decoration: none;
        }

        li a:hover {
            color: var(--primary-dark);
            text-decoration: none;
        }

        .tag {
            display: inline-block;

            margin-left: 8px;

            color: #818cf8;

            font-size: 13px;
            font-weight: 500;
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-top: 20px;

            padding: 10px 16px;

            background: var(--primary);

            color: white !important;

            border-radius: 10px;

            text-decoration: none !important;

            font-size: 14px;
            font-weight: 600;

            transition: background-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .button:hover {
            background: var(--primary-dark);

            transform: translateY(-1px);

            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.18);
        }


        /* =========================
           NOTE DETAIL
        ========================= */

        .note-info {
            display: grid;
            gap: 14px;

            margin-top: 24px;
        }

        .note-info p {
            margin: 0;

            padding: 14px 16px;

            background: #f8fafc;

            border: 1px solid var(--border);
            border-radius: 10px;

            color: #475569;
        }

        .note-info strong {
            color: var(--text);
        }


        /* =========================
           CREATE FORM
        ========================= */

        .form-description {
            margin-top: -2px;
            margin-bottom: 28px;

            color: var(--text-secondary);

            font-size: 15px;
        }

        .note-form {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px 14px;

            font-family: inherit;
            font-size: 15px;

            color: var(--text);

            background: #ffffff;

            border: 1px solid var(--border);
            border-radius: 10px;

            outline: none;

            transition: border-color 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.2s ease;
        }

        .form-group textarea {
            min-height: 160px;

            resize: vertical;

            line-height: 1.6;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #94a3b8;
        }

        .form-group input:hover,
        .form-group textarea:hover {
            border-color: #cbd5e1;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);

            background: #ffffff;

            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }


        /* =========================
           FORM ACTIONS
        ========================= */

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-top: 30px;
            padding-top: 24px;

            border-top: 1px solid var(--border);
        }

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 20px;

            background: var(--primary);
            color: #ffffff;

            border: none;
            border-radius: 10px;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: background-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .submit-button:hover {
            background: var(--primary-dark);

            transform: translateY(-1px);

            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.2);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .cancel-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            color: #475569 !important;

            background: #ffffff;

            border: 1px solid var(--border);
            border-radius: 10px;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none !important;

            transition: background-color 0.2s ease,
            border-color 0.2s ease,
            color 0.2s ease;
        }

        .cancel-button:hover {
            background: #f8fafc;

            border-color: #cbd5e1;

            color: var(--text) !important;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            nav {
                height: auto;

                padding: 12px 16px;

                overflow-x: auto;
            }

            nav a {
                white-space: nowrap;
            }

            main {
                width: calc(100% - 28px);

                margin: 32px auto;
            }

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 28px;
            }

            .form-actions {
                flex-direction: column;

                align-items: stretch;
            }

            .submit-button,
            .cancel-button {
                width: 100%;
            }
        }

    </style>
</head>

<body>

{% include 'navbar.html' %}
{% block content %}

{% endblock %}

</body>
</html>
