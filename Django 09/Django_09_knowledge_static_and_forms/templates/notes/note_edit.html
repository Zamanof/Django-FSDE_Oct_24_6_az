{% extends 'base.html' %}

{% block title %}
    {{ note.title }}
{% endblock %}

{% block content %}
<h1>
              Yeni qeyd yarat
          </h1>
 
          <p class="form-description">
              Yeni qeydin məlumatlarını daxil edin.
          </p>
 
 
          <form
              method="post"
              class="note-form"
          >

            {% csrf_token %}


              <div class="form-group">

                  <label for="title">
                      Ad
                  </label>

                  <input
                      id="title"
                      type="text"
                      name="title"
                      value="{{ note.title }}"
                      placeholder="Qeydin adını daxil edin"
                  >

              </div>


              <div class="form-group">

                  <label for="body">
                      Mətn
                  </label>

                  <textarea
                      id="body"
                      name="body"
                      rows="6"
                      placeholder="Qeydinizin mətnini bura yazın"
                  >{{ note.content }}</textarea>

              </div>


              <div class="form-group">

                  <label for="tag">
                      Tag
                  </label>

                  <input
                      id="tag"
                      type="text"
                      name="tag"
                      value="{{ note.tags|join:' ' }}"
                      placeholder="Məsələn: django"
                  >

              </div>


              <div class="form-group">

                  <label for="category">
                      Kateqoriya
                  </label>

                  <input
                      id="category"
                      type="text"
                      name="category"
                      value="{{ note.category }}"
                      placeholder="Məsələn: Backend"
                  >

              </div>


              <div class="form-actions">

                  <button
                      type="submit"
                      class="submit-button"
                  >
                      Yadda saxla
                  </button>


                  <a
                      href="{% url 'notes_list' %}"
                      class="cancel-button"
                  >
                      Ləğv et
                  </a>

              </div>

          </form>
{% endblock %}
